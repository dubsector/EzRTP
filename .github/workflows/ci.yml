name: CI (26.2-build)

on:
  push:
    branches:
      - dubsector/26.2-build

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install zizmor==1.26.1

      - name: Run zizmor
        run: zizmor --format plain .github/workflows/ || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Spotless lint
        run: mvn -B -ntp spotless:check

  module-build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - ezrtp-common
          - ezrtp-bukkit
          - ezrtp-paper
          - ezrtp-spigot
          - ezrtp-purpur
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build module
        env:
          MODULE: ${{ matrix.module }}
        run: mvn -B -ntp -pl "$MODULE" -am -DskipTests -Dspotless.check.skip=true package

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run unit tests
        run: mvn -B -ntp -pl ezrtp-bukkit,ezrtp-paper -am -Dspotless.check.skip=true test

  feature-tests:
    name: Feature Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run feature tests
        run: mvn -B -ntp -pl ezrtp-bukkit -am -Pmessage-tests -Dspotless.check.skip=true test

  paper-26-2-smoke-test:
    name: Paper 26.2 Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin JARs
        run: |
          mvn -B -ntp -pl ezrtp-bukkit,ezrtp-paper -am -DskipTests -Dspotless.check.skip=true package

      - name: Resolve Paper 26.2 build
        id: paper
        run: |
          set -euo pipefail
          VERSIONS=$(curl -fsSL https://api.papermc.io/v2/projects/paper | \
            python3 -c "import sys,json; print('\n'.join(json.load(sys.stdin)['versions']))")
          if ! echo "$VERSIONS" | grep -qx "26.2"; then
            echo "::warning::Paper 26.2 is not yet on the download API - smoke test skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/26.2/builds" | \
            python3 -c "
          import sys, json
          builds = json.load(sys.stdin)['builds']
          stable = [b for b in builds if b.get('channel') == 'default']
          print((stable or builds)[-1]['build'])
          ")
          JAR_NAME=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/26.2/builds/${BUILD}" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['downloads']['application']['name'])")
          echo "build=${BUILD}"       >> "$GITHUB_OUTPUT"
          echo "jar_name=${JAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "available=true"       >> "$GITHUB_OUTPUT"
          echo "Resolved: Paper 26.2 build ${BUILD} (${JAR_NAME})"

      - name: Download Paper 26.2 server JAR
        if: steps.paper.outputs.available == 'true'
        run: |
          mkdir -p smoke-server/plugins
          curl -fsSL \
            "https://api.papermc.io/v2/projects/paper/versions/26.2/builds/${{ steps.paper.outputs.build }}/downloads/${{ steps.paper.outputs.jar_name }}" \
            -o smoke-server/paper.jar

      - name: Copy plugin JARs
        if: steps.paper.outputs.available == 'true'
        run: |
          cp ezrtp-bukkit/target/EzRTP-*.jar      smoke-server/plugins/EzRTP.jar
          cp ezrtp-paper/target/ezrtp-paper-*.jar smoke-server/plugins/EzRTPPaperModule.jar

      - name: Configure server
        if: steps.paper.outputs.available == 'true'
        run: |
          echo "eula=true" > smoke-server/eula.txt
          printf '%s\n' \
            "online-mode=false" \
            "level-type=flat" \
            "generate-structures=false" \
            "max-players=0" \
            > smoke-server/server.properties

      - name: Run server and wait for ready
        if: steps.paper.outputs.available == 'true'
        run: |
          cd smoke-server
          java -Xms512m -Xmx1g -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          ELAPSED=0
          while [ $ELAPSED -lt 120 ]; do
            sleep 2; ELAPSED=$((ELAPSED + 2))
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "Server ready after ${ELAPSED}s"; break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited after ${ELAPSED}s"; break
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Assert no EzRTP errors
        if: steps.paper.outputs.available == 'true'
        run: |
          LOG=smoke-server/server.log
          if grep -qiE "SEVERE.*[Ee]z[Rr][Tt][Pp]|Could not load.*[Ee]z[Rr][Tt][Pp]|Error.*[Ee]z[Rr][Tt][Pp]" "$LOG"; then
            echo "::error::EzRTP logged errors on Paper 26.2 startup:"
            grep -iE "SEVERE.*[Ee]z[Rr][Tt][Pp]|Could not load.*[Ee]z[Rr][Tt][Pp]|Error.*[Ee]z[Rr][Tt][Pp]" "$LOG"
            exit 1
          fi
          echo "Paper 26.2 smoke test passed — EzRTP loaded cleanly."

      - name: Upload server log
        if: always() && steps.paper.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-26-2-smoke-server-log
          path: smoke-server/server.log
          retention-days: 7
